<!DOCTYPE html>
<html>
<head>
  <title>Love App ❤️</title>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #ffe6f0;
      overflow: hidden;
    }

    h1 {
      margin-top: 20px;
    }

    img {
      width: 200px;
      margin-top: 20px;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 18px;
      border: none;
      cursor: pointer;
      border-radius: 10px;
    }

    .yes {
      background: green;
      color: white;
    }

    .no {
      background: red;
      color: white;
    }

    #msg {
      font-size: 20px;
      margin-top: 20px;
    }

    .heart {
      position: absolute;
      color: red;
      font-size: 20px;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-50px); opacity: 1; }
      100% { transform: translateY(600px); opacity: 0; }
    }
  </style>
</head>

<body>

  <h1>Do you love me? ❤️</h1>

  <img src="https://i.imgur.com/J5bT2.jpg" id="cat">

  <div>
    <button class="yes" onclick="yes()">YES ❤️</button>
    <button class="no" onclick="no()">NO 💔</button>
  </div>

  <div id="msg"></div>

<script>
let messages = [
  "Think again 😏",
  "Are you sure? 🤨",
  "Cat bhi confuse hai 🐱",
  "Network issue lag raha hai 🤔",
  "No option exist nahi karta 😜",
  "Dil se socho ❤️😅",
  "Last warning 😈",
  "Ab to Yes hi dabana padega 😆"
];

let count = 0;

function yes(){
  document.getElementById("msg").innerHTML = "Aww ❤️ I love you too!";
  hearts();
}

function no(){
  document.getElementById("msg").innerHTML = messages[count % messages.length];
  count++;
}

function hearts(){
  for(let i=0;i<20;i++){
    let h = document.createElement("div");
    h.innerHTML = "❤️";
    h.classList.add("heart");
    h.style.left = Math.random()*window.innerWidth + "px";
    document.body.appendChild(h);

    setTimeout(()=>{ h.remove(); }, 3000);
  }
}
</script>

</body>
</html>
